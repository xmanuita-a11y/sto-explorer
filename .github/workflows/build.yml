name: Build verification

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the offline reader
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the offline HTML
        run: python run_tests.py

      - name: Check every shipped script parses
        shell: bash
        run: |
          for file in sto-*.js; do
            node --check "$file"
          done

      - name: Verify the built file
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          path = "STO_Reader_Offline.html"
          size = os.path.getsize(path) if os.path.exists(path) else 0
          markers = ["Content-Security-Policy", "STO_NATIVE_GARAGE_CATALOG", "1.0.0-rc.4"]
          text = open(path, encoding="utf-8").read() if size else ""
          missing = [marker for marker in markers if marker not in text]
          if size < 100000 or missing:
              sys.exit(f"{path}: {size} bytes, missing {missing}")
          print(f"{path}: {size} bytes, markers present")
          PY
